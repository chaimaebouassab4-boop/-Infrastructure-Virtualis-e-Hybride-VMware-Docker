events {
    worker_connections 1024;
}

http {
    upstream wordpress {
        server wordpress:80;
    }

    # [cite_start]Redirection HTTP vers HTTPS [cite: 2008]
    server {
        listen 80;
        server_name 192.168.180.38; # IP de la VM Ubuntu
        return 301 https://$server_name$request_uri;
    }

    # [cite_start]Configuration HTTPS [cite: 2009]
    server {
        listen 443 ssl;
        server_name 192.168.180.38;

        # Certificats SSL (Générés via Certbot/OpenSSL)
        ssl_certificate /etc/nginx/ssl/fullchain.pem; 
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://wordpress;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
